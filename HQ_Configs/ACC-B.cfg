!
! ACC-B
! Access Layer Switch B
!

hostname ACC-B

!
! Local Authentication
!

enable secret <REDACTED>

username admin secret <REDACTED>

!
! Layer 2 Configuration
!

spanning-tree mode rapid-pvst

!
! VLANs
!

vlan 10
 name MGMT

vlan 20
 name USERS

vlan 30
 name WIFI

vlan 40
 name GUEST

vlan 100
 name FINANCE

!
! Trunk Links
!

interface GigabitEthernet0/0
 description to_ACC-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100

interface GigabitEthernet0/1
 description to_MLS-CORE-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100

interface GigabitEthernet0/2
 description to_MLS-CORE-B
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100

!
! Access Ports
!

interface GigabitEthernet1/0
 description to_HOST-C
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast edge
 spanning-tree bpduguard enable

interface GigabitEthernet1/1
 description to_NMS-SERVER
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast edge
 spanning-tree bpduguard enable

!
! Management Interface
!

interface Vlan10
 ip address 10.42.10.12 255.255.255.240

ip default-gateway 10.42.10.1

!
! Console Access
!

line con 0
 logging synchronous
 login local

!
! Remote Access
!

line vty 0 4
 logging synchronous
 login local

!
! End
!
