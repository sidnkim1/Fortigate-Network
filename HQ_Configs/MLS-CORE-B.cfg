!
! MLS-CORE-B
! Core Layer Switch B
!

hostname MLS-CORE-B

!
! Local Authentication
!

enable secret <REDACTED>

username admin secret <REDACTED>

!
! Layer 2 Configuration
!

spanning-tree mode pvst

!
! VLANs
!

vlan 10
 name MGMT

vlan 20
 name USERS

vlan 30
 name WIFI

vlan 40
 name GUEST

vlan 100
 name FINANCE

vlan 999
 name OSPF_TRANSIT

!
! Port-Channel to MLS-CORE-A
!

interface Port-channel1
 description to_MLS-CORE-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100,999

!
! Firewall Transit Links
!

interface GigabitEthernet0/0
 description to_FG-FW-A
 no switchport
 ip address 10.42.5.6 255.255.255.252

interface GigabitEthernet0/1
 description to_FG-FW-B
 no switchport
 ip address 10.42.5.14 255.255.255.252

!
! Core Interconnect
!

interface GigabitEthernet0/2
 description to_MLS-CORE-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100,999
 channel-group 1 mode active

interface GigabitEthernet0/3
 description to_MLS-CORE-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100,999
 channel-group 1 mode active

!
! Access Layer Uplinks
!

interface GigabitEthernet1/0
 description to_ACC-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100

interface GigabitEthernet2/0
 description to_ACC-B
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,100

!
! VLAN Interfaces
!

interface Vlan10
 ip address 10.42.10.3 255.255.255.240
 standby version 2
 standby 10 ip 10.42.10.1
 standby 10 priority 90

interface Vlan20
 ip address 10.42.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.42.20.1
 standby 20 priority 90

interface Vlan30
 ip address 10.42.30.3 255.255.255.0
 standby version 2
 standby 30 ip 10.42.30.1
 standby 30 priority 110
 standby 30 preempt delay minimum 300

interface Vlan40
 ip address 10.42.40.3 255.255.255.0
 standby version 2
 standby 40 ip 10.42.40.1
 standby 40 priority 110
 standby 40 preempt delay minimum 300

interface Vlan100
 ip address 10.42.100.3 255.255.255.0
 standby version 2
 standby 100 ip 10.42.100.1
 standby 100 priority 90

interface Vlan999
 description OSPF_TRANSIT
 ip address 10.42.254.2 255.255.255.252
 no shutdown

!
! OSPF
!

router ospf 42
 router-id 10.42.10.3

 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 passive-interface Vlan40
 passive-interface Vlan100

 network 10.42.5.4 0.0.0.3 area 0
 network 10.42.5.12 0.0.0.3 area 0
 network 10.42.254.0 0.0.0.3 area 0

 network 10.42.10.0 0.0.0.15 area 0
 network 10.42.20.0 0.0.0.255 area 0
 network 10.42.30.0 0.0.0.255 area 0
 network 10.42.40.0 0.0.0.255 area 0
 network 10.42.100.0 0.0.0.255 area 0

!
! Console Access
!

line con 0
 logging synchronous
 login local

!
! Remote Access
!

line vty 0 4
 logging synchronous
 login local

!
! End
!
