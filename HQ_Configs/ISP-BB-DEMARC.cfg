!
! ISP-BB-DEMARC
! Secondary WAN Demarcation Router
!

hostname ISP-BB-DEMARC

!
! WAN Handoff
!

interface GigabitEthernet0/1
 description to_SW-BB
 ip address 172.16.0.9 255.255.255.248
 no shutdown

!
! Future Internet Connectivity
!

interface GigabitEthernet0/0
 description to_ISP-BB_CLOUD
 shutdown

!
! Simulated Internet Services
!

interface Loopback100
 ip address 1.1.1.1 255.255.255.255

interface Loopback101
 ip address 1.0.0.1 255.255.255.255

!
! Console Access
!

line con 0
 logging synchronous

!
! Remote Access
!

line vty 0 4
 logging synchronous

!
! End
!
