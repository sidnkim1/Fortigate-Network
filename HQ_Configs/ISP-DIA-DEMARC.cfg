!
! ISP-DIA-DEMARC
! Primary WAN Demarcation Router
!

hostname ISP-DIA-DEMARC

!
! WAN Handoff
!

interface GigabitEthernet0/1
 description to_SW-DIA
 ip address 172.16.0.1 255.255.255.248
 no shutdown

!
! Future Internet Connectivity
!

interface GigabitEthernet0/0
 description to_ISP-DIA_CLOUD
 shutdown

!
! Simulated Internet Services
!

interface Loopback100
 ip address 8.8.8.8 255.255.255.255

interface Loopback101
 ip address 8.8.4.4 255.255.255.255

!
! Console Access
!

line con 0
 logging synchronous

!
! Remote Access
!

line vty 0 4
 logging synchronous

!
! End
!
